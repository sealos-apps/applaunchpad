# yaml-language-server: $schema=config.schema.json
cloud:
  domain: cloud.example.io
  port: 443
  httpPort: 80
  disableHttps: false
  nodePortHost: '' # Public host/IP for NodePort; empty disables new NodePort access.
  desktopDomain: cloud.example.io
  userDomains:
    - name: cloud.example.io
      secretName: wildcard-cert

launchpad:
  infrastructure:
    provider: 'alibaba'
    requiresIcpReg: false
    icpRegQueryLink: 'https://beian.miit.gov.cn/#/Integrated/index'
    domainBindingDocumentationLink: null

  ui:
    meta:
      title: 'Sealos App Launchpad'
      description: 'Deploy and manage your applications on Sealos'
      scripts: []
    appResourceFormSliderConfig:
      default:
        cpu: [100, 200, 500, 1000, 2000, 3000, 4000, 8000]
        memory: [64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]

  components:
    monitoring:
      # Direct Prometheus-compatible metrics endpoint, configured through the ConfigMap.
      url: http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc.cluster.local:8481/select/0/prometheus
    billing:
      url: http://account-service.account-system.svc:2333
    logging:
      enabled: true
      url: http://log-service.sealos.svc.cluster.local:8080
    eventAnalysis:
      enabled: false
      url: https://fastgpt.run/api/openapi/v1
      fastGPTKey: ''

  features:
    guide: false
    api: false
    gpu: false
    networkStorage: false # Mount existing shared PVCs without taking ownership.

  imagePorts:
    enabled: false # Registry metadata inspection; enabled on demand by operators.
    trustedRegistries: []
  publicDomain:
    customPrefixEnabled: false
    reservedPrefixes: []
  customDomain:
    mode: cname # certificate requires an existing certificate integration.
    certificate:
      tlsSecretName: wildcard-cert

  checkIcpReg:
    enabled: false
    endpoint: ''
    accessKeyID: ''
    accessKeySecret: ''

  analytics:
    gtm:
      enabled: false
      gtmId: ''
    rybbit:
      host: ''
      siteId: ''

  fileManager:
    uploadLimit: 50
    downloadLimit: 100

  domainChallengeSecret: default-dev-secret-change-in-production
  pvcStorageMax: 100
