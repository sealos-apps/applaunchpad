# Default values for applaunchpad frontend helm chart.

image: ghcr.io/labring/sealos-applaunchpad-frontend:latest
imagePullPolicy: Always

imagePullSecrets: []
fullnameOverride: 'applaunchpad-frontend'

# Service identity used only for platform certificate read access; tenant operations use user credentials.
serviceAccount:
  create: true
  name: applaunchpad-frontend
  annotations: {}
# Off by default so clusters without Higress can install the same chart.
certificateRbac:
  enabled: false
replicaCount: 1

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - 'ALL'

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

ingress:
  className: nginx
  host: ''
  annotations: {}

# cloudDomain, cloudPort, httpPort, disableHttps and certSecretName are auto-configured by entrypoint.sh from sealos-config.
applaunchpadConfig:
  requiresDomainReg: false # ICP policy; installers may derive it from billing currency.
  domainChallengeSecret: 'default-dev-secret-change-in-production' # Override for production domain challenges.
  cloudDomain: '127.0.0.1.nip.io'
  cloudPort: ''
  httpPort: ''
  disableHttps: false
  certSecretName: 'wildcard-cert'
  # Direct Prometheus-compatible base URL for metrics-sdk (not launchpad-monitor).
  monitorUrl: 'http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc.cluster.local:8481/select/0/prometheus'
  billingUrl: 'http://account-service.account-system.svc:2333'
  logUrl: ''
  tlsRejectUnauthorized: '1'
  # Rybbit Analytics (self-hosted); empty disables tracking
  rybbitHost: ''
  rybbitSiteId: ''

  # Optional capabilities; enable with -f custom-values.yaml or --set applaunchpadConfig.<key>.
  nodePortHost: '' # Public NodePort host/IP. Empty disables creating NodePort access in UI.
  networkStorageEnabled: false # Allow mounting existing shared PVCs; never implies ownership.
  imagePortsEnabled: false # Inspect image metadata on demand.
  imagePortsTrustedRegistries: [] # Explicit registries allowed by the image inspection policy.
  customPublicDomainPrefixEnabled: false # Allow user-selected public hostname prefixes.
  publicDomainReservedPrefixes: [] # Prefixes users may not claim.
  customDomainMode: 'cname' # cname or certificate; certificate requires existing cert-manager/Higress setup.
  customDomainCertificateSecretName: 'wildcard-cert' # Certificate coverage lookup target.
  guideEnabled: false
  apiEnabled: false
  gpuEnabled: false
  pvcStorageMax: 100 # Maximum local PVC size in Gi.
  fileManger: # Legacy Helm spelling retained for existing operator values.
    uploadLimit: 50 # MiB
    downloadLimit: 100 # MiB
  appResourceFormSliderConfig:
    default:
      cpu: [100, 200, 500, 1000, 2000, 3000, 4000, 8000]
      memory: [64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
      ephemeralStorage: [10, 20, 30, 40, 50]
    defaultGPU: # Legacy Helm key; normalized to default-gpu at runtime.
      cpu: [8000, 16000, 32000, 48000, 64000, 80000, 108000]
      memory: [16384, 32768, 65536, 131072, 262144, 524288, 614400]

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: 'app'
                operator: In
                values:
                  - applaunchpad-frontend
          topologyKey: 'kubernetes.io/hostname'
