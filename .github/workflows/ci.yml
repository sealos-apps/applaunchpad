name: AppLaunchpad Images

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "main/**"
      - "release-v5.1/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main/**"
      - "release-v5.1/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish images for branch runs (always enabled for tags)
        required: true
        default: false
        type: boolean
      upload_oss:
        description: Upload archives to OSS for branch runs (always enabled for tags; also publishes images)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: applaunchpad-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  RUNTIME_IMAGE_NAME: ghcr.io/${{ github.repository }}/applaunchpad-frontend
  CLUSTER_IMAGE_NAME: ghcr.io/${{ github.repository }}/applaunchpad-cluster
  SEALOS_VERSION: v5.1.2-rc5

jobs:
  validate:
    name: Validate ${{ matrix.snapshot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        snapshot:
          - main
          - release-v5.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: ${{ matrix.snapshot }}/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: ${{ matrix.snapshot }}
        run: pnpm install --frozen-lockfile
      - name: Run AppLaunchpad unit tests
        if: matrix.snapshot == 'main'
        working-directory: ${{ matrix.snapshot }}
        run: pnpm --filter applaunchpad run test:unit
      - name: Build AppLaunchpad
        working-directory: ${{ matrix.snapshot }}
        run: pnpm --filter applaunchpad run build
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.0
      - name: Validate Helm chart
        env:
          DEPLOY_DIR: ${{ matrix.snapshot }}/applaunchpad/deploy
        run: |
          set -euo pipefail
          helm lint "${DEPLOY_DIR}/charts/applaunchpad-frontend"
          helm template applaunchpad-frontend "${DEPLOY_DIR}/charts/applaunchpad-frontend" \
            --namespace applaunchpad-frontend >/dev/null

  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      main_tag: ${{ steps.metadata.outputs.main_tag }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            # Restrict release refs to Docker-compatible semantic versions.
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2; exit 1;
            }
            echo "main_tag=main-${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "release_tag=release-v5.1-${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "main_tag=main-${short_sha}" >> "${GITHUB_OUTPUT}"
            echo "release_tag=release-v5.1-${short_sha}" >> "${GITHUB_OUTPUT}"
          fi

  runtime-images:
    name: Build runtime ${{ matrix.snapshot }} (${{ matrix.arch }})
    needs:
      - validate
      - release-metadata
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref_type == 'tag' || inputs.publish_images == true || inputs.upload_oss == true))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        snapshot:
          - main
          - release-v5.1
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Select image tag
        id: image-tag
        env:
          SNAPSHOT: ${{ matrix.snapshot }}
          MAIN_TAG: ${{ needs.release-metadata.outputs.main_tag }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          case "${SNAPSHOT}" in
            main) echo "image_tag=${MAIN_TAG}" >> "${GITHUB_OUTPUT}" ;;
            release-v5.1) echo "image_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unsupported snapshot: ${SNAPSHOT}" >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.snapshot }}
          file: ./${{ matrix.snapshot }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.RUNTIME_IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runtime-${{ matrix.snapshot }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.snapshot }}-${{ matrix.arch }}

  runtime-release:
    needs:
      - runtime-images
      - release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish runtime manifests
        env:
          MAIN_TAG: ${{ needs.release-metadata.outputs.main_tag }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local tag="$1"
            local stable_tag="$2"
            local aliases=(-t "${RUNTIME_IMAGE_NAME}:${tag}")
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              aliases+=(-t "${RUNTIME_IMAGE_NAME}:${stable_tag}")
            fi
            docker buildx imagetools create "${aliases[@]}" \
              "${RUNTIME_IMAGE_NAME}:${tag}-amd64" \
              "${RUNTIME_IMAGE_NAME}:${tag}-arm64"
            docker buildx imagetools inspect "${RUNTIME_IMAGE_NAME}:${tag}"
          }
          publish_manifest "${MAIN_TAG}" latest
          publish_manifest "${RELEASE_TAG}" release-v5.1-latest

  cluster-images:
    name: Build cluster ${{ matrix.snapshot }} (${{ matrix.arch }})
    needs:
      - runtime-release
      - release-metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        snapshot:
          - main
          - release-v5.1
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Select image tag
        id: image-tag
        env:
          SNAPSHOT: ${{ matrix.snapshot }}
          MAIN_TAG: ${{ needs.release-metadata.outputs.main_tag }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          case "${SNAPSHOT}" in
            main) echo "image_tag=${MAIN_TAG}" >> "${GITHUB_OUTPUT}" ;;
            release-v5.1) echo "image_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "Unsupported snapshot: ${SNAPSHOT}" >&2; exit 1 ;;
          esac
      - name: Install Sealos
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          curl -fsSL -o "${work_dir}/sealos.tar.gz" \
            "https://github.com/labring/sealos/releases/download/${SEALOS_VERSION}/sealos_${SEALOS_VERSION#v}_linux_${ARCH}.tar.gz"
          tar -xzf "${work_dir}/sealos.tar.gz" -C "${work_dir}"
          sudo install "${work_dir}/sealos" /usr/local/bin/sealos
          sealos version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Sealos to GHCR
        run: sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
      - name: Build, publish, and archive cluster image
        working-directory: ${{ matrix.snapshot }}/applaunchpad/deploy
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
          RUNTIME_IMAGE: ${{ env.RUNTIME_IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}
          CLUSTER_IMAGE: ${{ env.CLUSTER_IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}-${{ matrix.arch }}
          ARCHIVE_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sed -i -E "s|^image: .*|image: ${RUNTIME_IMAGE}|" charts/applaunchpad-frontend/values.yaml
          sudo sealos registry save --registry-dir=registry --arch "${ARCH}" .
          sudo sealos build -t "${CLUSTER_IMAGE}" --platform "linux/${ARCH}" -f Kubefile .
          sudo sealos push "${CLUSTER_IMAGE}"
          archive_basename="applaunchpad-cluster-${IMAGE_TAG}-${ARCH}"
          sudo sealos save -o "${ARCHIVE_DIR}/${archive_basename}.tar" "${CLUSTER_IMAGE}"
          gzip -f "${ARCHIVE_DIR}/${archive_basename}.tar"
          (cd "${ARCHIVE_DIR}" && md5sum "${archive_basename}.tar.gz" > "${archive_basename}.tar.gz.md5")
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-bundle-${{ matrix.snapshot }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/applaunchpad-cluster-*.tar.gz
            ${{ runner.temp }}/applaunchpad-cluster-*.tar.gz.md5
          if-no-files-found: error
          retention-days: 7

  cluster-release:
    needs:
      - cluster-images
      - release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish cluster manifests
        env:
          MAIN_TAG: ${{ needs.release-metadata.outputs.main_tag }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local tag="$1"
            local stable_tag="$2"
            local aliases=(-t "${CLUSTER_IMAGE_NAME}:${tag}")
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              aliases+=(-t "${CLUSTER_IMAGE_NAME}:${stable_tag}")
            fi
            docker buildx imagetools create "${aliases[@]}" \
              "${CLUSTER_IMAGE_NAME}:${tag}-amd64" \
              "${CLUSTER_IMAGE_NAME}:${tag}-arm64"
            docker buildx imagetools inspect "${CLUSTER_IMAGE_NAME}:${tag}"
          }
          publish_manifest "${MAIN_TAG}" latest
          publish_manifest "${RELEASE_TAG}" release-v5.1-latest

  oss-upload:
    name: Upload cluster archives to OSS (${{ matrix.snapshot }})
    needs:
      - cluster-images
      - cluster-release
      - release-metadata
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) || (github.event_name == 'workflow_dispatch' && (github.ref_type == 'tag' || inputs.upload_oss == true))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        snapshot:
          - main
          - release-v5.1
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cluster-bundle-${{ matrix.snapshot }}-*
          path: cluster-bundles
          merge-multiple: true
      - name: Upload cluster archives to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          SNAPSHOT: ${{ matrix.snapshot }}
          MAIN_TAG: ${{ needs.release-metadata.outputs.main_tag }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        shell: bash
        working-directory: cluster-bundles
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          case "${SNAPSHOT}" in
            main) image_tag="${MAIN_TAG}" ;;
            release-v5.1) image_tag="${RELEASE_TAG}" ;;
            *) echo "Unsupported snapshot: ${SNAPSHOT}" >&2; exit 1 ;;
          esac
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            oss_prefix="release/${GITHUB_REF_NAME}/${SNAPSHOT}"
          else
            oss_prefix="ci/${SNAPSHOT}/${short_sha}"
          fi

          shopt -s nullglob
          archives=(*.tar.gz)
          checksums=(*.tar.gz.md5)
          [[ "${#archives[@]}" -eq 2 ]] || { echo "Expected 2 cluster archives, found ${#archives[@]}" >&2; exit 1; }
          [[ "${#checksums[@]}" -eq 2 ]] || { echo "Expected 2 cluster checksums, found ${#checksums[@]}" >&2; exit 1; }
          for arch in amd64 arm64; do
            archive="applaunchpad-cluster-${image_tag}-${arch}.tar.gz"
            [[ -f "${archive}" && -f "${archive}.md5" ]] || { echo "Missing archive or checksum: ${archive}" >&2; exit 1; }
            md5sum -c "${archive}.md5"
          done

          curl --retry 3 -fsSL https://gosspublic.alicdn.com/ossutil/install.sh -o "${RUNNER_TEMP}/install-ossutil.sh"
          sudo bash "${RUNNER_TEMP}/install-ossutil.sh"
          command -v ossutil64
          for file in "${archives[@]}" "${checksums[@]}"; do
            ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
              "${file}" "oss://${OSS_BUCKET%/}/${oss_prefix}/${file}"
          done

  github-release:
    name: Publish GitHub release assets
    needs:
      - release-metadata
      - oss-upload
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cluster-bundle-*
          path: cluster-bundles
          merge-multiple: true
      - name: Verify and publish all release archives
        working-directory: cluster-bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAIN_TAG: ${{ needs.release-metadata.outputs.main_tag }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz)
          checksums=(*.tar.gz.md5)
          [[ "${#archives[@]}" -eq 4 && "${#checksums[@]}" -eq 4 ]] || {
            echo "Expected four archives and four checksums" >&2; exit 1;
          }
          for image_tag in "${MAIN_TAG}" "${RELEASE_TAG}"; do
            for arch in amd64 arm64; do
              archive="applaunchpad-cluster-${image_tag}-${arch}.tar.gz"
              [[ -f "${archive}" && -f "${archive}.md5" ]]
              md5sum -c "${archive}.md5"
            done
          done

          release_flags=(--prerelease=false)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --draft \
              --title "${GITHUB_REF_NAME}" --generate-notes "${release_flags[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" "${archives[@]}" "${checksums[@]}" --clobber

          # Read back every uploaded asset's digest before publishing the draft.
          gh release view "${GITHUB_REF_NAME}" --json assets > assets.json
          for file in "${archives[@]}" "${checksums[@]}"; do
            digest="sha256:$(sha256sum "${file}" | cut -d ' ' -f 1)"
            jq -e --arg name "${file}" --arg digest "${digest}" \
              '[.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest)] | length == 1' \
              assets.json >/dev/null
          done
          gh release edit "${GITHUB_REF_NAME}" --draft=false "${release_flags[@]}"
